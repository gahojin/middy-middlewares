packages:
  - packages/**

# 重複排除
dedupePeers: true

catalog:
  rolldown: 1.2.8
  rolldown-plugin-dts: 0.28.6
  turbo: 2.10.13
  typescript: 7.0.2
  valibot: 1.5.0
  vitest: &vitest_ver 5.0.1
  '@biomejs/biome': 2.5.14
  '@fast-check/vitest': 0.5.0
  '@gahojin-inc/aws-lambda-mock-context': 2026.8.0
  '@middy/core': &middy_ver 7.7.2
  '@middy/util': *middy_ver
  '@serverless/event-mocks': 1.1.1
  '@types/aws-lambda': 8.10.163
  '@types/node': 26.6.1
  '@valibot/i18n': 1.3.0
  '@vitest/coverage-v8': *vitest_ver

overrides:
  rolldown: 'catalog:'

# リリースから一定時間経過していないか、信頼性低下したパッケージはインストールしない
minimumReleaseAge: 2880 # 2d
minimumReleaseAgeIgnoreMissingTime: false
trustPolicy: no-downgrade

# 特殊なソースからの依存関係をインストールしない
blockExoticSubdeps: true
